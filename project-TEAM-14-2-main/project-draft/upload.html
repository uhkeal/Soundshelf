<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/logos/soundshelf-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Upload Music</title>
</head>

<body class="bg-dark text-white upload" >
    <div id="nav-bar"></div>

    <main>
        <header>
            <h2>Upload your Music!</h2>
        </header>
        <section>
            <form>
                <div>
                    <label for="song-name">Song Name:</label>
                    <input id="song-name" type="text" name="song-name" placeholder="Enter song name">
                </div>
                <div>
                    <label for="music-file">Upload File:</label>
                    <input id="music-file" type="file" name="music-file">
                </div>
                <div>
                    <label for="song-cover">Song Cover:</label>
                    <input id="song-cover" type="file" name="song-cover">
                </div>
                <div>
                    <label for="youtube-link">YouTube Link (Optional):</label>
                    <input id="youtube-link" type="url" name="youtube-link" placeholder="https://youtube.com/watch?v=...">
                </div>
                <div>
                    <label for="tags">Tags:</label>
                    <input id="tags" type="text" name="tags" placeholder="e.g. pop, lo-fi, rap">
                </div>
                <button type="submit">Upload</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SoundShelf</p>
    </footer>
    <script src="js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
